<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>eikon parcel starter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="content">
      <div id="board"></div>
      <div class="rules">
        <div class="info-button">
          <span>Oops... i forgot the rules too. mb.</span>
          <img src="info-icon.svg" alt="info" />
        </div>
        <div>
          <h1>2 player Memory game</h1>
          <p>
            (Browser only btw) this is a simple game really. if ever in doubt,
            just hover on the info logo for a quick rules reminder.
          </p>
        </div>

        <div class="scoreboard">
          <span id="playerTurn"></span>
          <div class="score">
            <div>
              <p>A</p>
              <span id="playerAScore"></span>
              <p>points</p>
            </div>
            <div>
              <p>B</p>
              <span id="playerBScore"></span>
              <p>points</p>
            </div>
          </div>
          <span id="pairFound"></span>
        </div>
        <!-- <button command="show-modal" commandfor="winnerReveal">
          dialog debug
        </button> -->
      </div>
    </div>

    <dialog id="winnerReveal">
      <p id="winner">It's a draw!</p>
      <button onClick="window.location.reload();">Replay</button>
    </dialog>

    <img id="hackedAlert" class="hackedHidden" src="hacked.jpg" alt="" />

    <script src="js/konami.js" type="module"></script>
    <script src="js/main.js" type="module"></script>
  </body>
</html>
