<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>2P memory game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="content">
      <div id="board" class="box"></div>
      <div class="rules box">
        <div class="info-button">
          <span>this website is human made !!</span>
          <img src="info-icon.svg" alt="info" />
        </div>
        <div>
          <h1>2 player Memory game</h1>
          <p>
            (Browser only btw) this is a simple game really. Flip two cards, if
            they match it's a point. If they dont, then you pass your turn.
            Refresh the page to reset the game.
          </p>
        </div>

        <div class="scoreboard box">
          <span id="playerTurn"></span>
          <div class="score">
            <div>
              <p>A</p>
              <span id="playerAScore"></span>
              <p>points</p>
            </div>
            <div>
              <p>B</p>
              <span id="playerBScore"></span>
              <p>points</p>
            </div>
          </div>
        </div>

        <audio
          class="box"
          controls
          src="sound/background_music.mp3"
          loop
        ></audio>
        <!-- <button command="show-modal" commandfor="winnerReveal">
          dialog debug
        </button> -->
      </div>
    </div>

    <dialog id="winnerReveal">
      <p id="winner">It's a draw!</p>
      <button onClick="window.location.reload();">Replay</button>
    </dialog>

    <img id="hackedAlert" class="hackedHidden" src="hacked.jpg" alt="" />

    <script src="js/konami.js" type="module"></script>
    <script src="js/main.js" type="module"></script>
  </body>
</html>
